  function pad2(num) {
    return String(num).padStart(2, "0");
  }

  async function fetchDrawHistory(marketType) {
    const apiMarket = marketType === "30s" ? "WinGo_30S" : "WinGo_1M";
    const endpoints = [
      `/api-draw/WinGo/${apiMarket}/GetHistoryIssuePage.json?ts=${Date.now()}`,
      `https://draw.ar-lottery06.com/WinGo/${apiMarket}/GetHistoryIssuePage.json?ts=${Date.now()}`
    ];

    for (const url of endpoints) {
      try {
        const response = await fetch(url);
        if (!response.ok) continue;
        const json = await response.json();
        if (json && json.data && Array.isArray(json.data.list)) {
          return json.data.list.flatMap((item) => {
            const parsedNum = Number.parseInt(item.number, 10);
            const issueNumber = String(item.issueNumber || "");
            if (!issueNumber || !Number.isInteger(parsedNum) || parsedNum < 0 || parsedNum > 9) return [];
            return [{
              issueNumber,
              period: issueNumber.slice(-4),
              number: parsedNum,
              sz: parsedNum >= 5 ? "BIG" : "SMALL"
            }];
          });
        }
      } catch (err) {
        // Ignore network/CORS errors and try fallback
      }
    }
    return [];
  }

  function mergeHistory(existingList, freshList) {
    const map = new Map();
    for (const item of freshList || []) {
      if (item && item.issueNumber) map.set(item.issueNumber, item);
    }
    for (const item of existingList || []) {
      if (item && item.issueNumber && !map.has(item.issueNumber)) {
        map.set(item.issueNumber, item);
      }
    }
    return Array.from(map.values())
      .sort((a, b) => b.issueNumber.localeCompare(a.issueNumber))
      .slice(0, 100);
  }

  function check12Cycle(sizes) {
    if (sizes.length < 3) {
      return { matched: false, predictedSz: "BIG" };
    }

    const isBigCycle =
      (sizes[0] === "BIG" &&
        sizes[1] === "BIG" &&
        sizes[2] === "SMALL" &&
        ((sizes.length >= 4 && sizes[3] !== "SMALL") ||
          (sizes.length >= 6 &&
            sizes[3] === "BIG" &&
            sizes[4] === "BIG" &&
            sizes[5] === "SMALL")));

    if (isBigCycle) {
      return { matched: true, predictedSz: "SMALL" };
    }

    const isPredBig =
      (sizes[0] === "SMALL" &&
        sizes[1] === "BIG" &&
        sizes[2] === "BIG" &&
        sizes.length >= 4 &&
        (sizes[3] === "SMALL" ||
          (sizes.length >= 6 && sizes[4] === "BIG" && sizes[5] === "BIG") ||
          (sizes.length >= 5 && sizes[3] === "BIG" && sizes[4] === "SMALL"))) ||
      (sizes[0] === "BIG" &&
        sizes[1] === "SMALL" &&
        sizes[2] === "BIG" &&
        sizes.length >= 4 &&
        sizes[3] === "BIG") ||
      (sizes[0] === "SMALL" &&
        sizes[1] === "SMALL" &&
        sizes[2] === "BIG" &&
        ((sizes.length >= 4 && sizes[3] !== "BIG") ||
          (sizes.length >= 6 &&
            sizes[3] === "SMALL" &&
            sizes[4] === "SMALL" &&
            sizes[5] === "BIG")));

    if (isPredBig) {
      return { matched: true, predictedSz: "BIG" };
    }

    const isPredSmall =
      (sizes[0] === "BIG" &&
        sizes[1] === "SMALL" &&
        sizes[2] === "SMALL" &&
        sizes.length >= 4 &&
        (sizes[3] === "BIG" ||
          (sizes.length >= 6 && sizes[4] === "SMALL" && sizes[5] === "SMALL") ||
          (sizes.length >= 5 && sizes[3] === "SMALL" && sizes[4] === "BIG"))) ||
      (sizes[0] === "SMALL" &&
        sizes[1] === "BIG" &&
        sizes[2] === "SMALL" &&
        sizes.length >= 4 &&
        sizes[3] === "SMALL");

    if (isPredSmall) {
      return { matched: true, predictedSz: "SMALL" };
    }

    return { matched: false, predictedSz: "BIG" };
  }

  function predictNextDraw(history) {
    if (!history || history.length === 0) {
      return { sz: "BIG", rn: 7, pattern: "DRAGON PATTERN" };
    }

    const recent100 = history.slice(0, 100);
    const sizes = recent100.map((item) => item.sz);

    // Streak count
    let streakCount = 1;
    for (let i = 1; i < sizes.length && sizes[i] === sizes[0]; i++) {
      streakCount++;
    }

    // Alternating count
    let altCount = 1;
    for (let i = 1; i < sizes.length && sizes[i] !== sizes[i - 1]; i++) {
      altCount++;
    }

    // Double pair pattern (e.g., BIG BIG SMALL SMALL)
    const isDoublePair =
      sizes.length >= 4 &&
      sizes[0] === sizes[1] &&
      sizes[2] === sizes[3] &&
      sizes[1] !== sizes[2];

    const recent20 = recent100.slice(0, 20);
    const bigRatio20 =
      recent20.filter((item) => item.sz === "BIG").length / recent20.length;

    const cycleResult = check12Cycle(sizes);
    let patternName = "REVERSAL PATTERN";
    let predictedSz = "BIG";

    if (streakCount >= 3) {
      patternName = "DRAGON PATTERN";
      predictedSz = sizes[0];
    } else if (altCount >= 3) {
      patternName = "ALTERNATE PATTERN";
      predictedSz = sizes[0] === "BIG" ? "SMALL" : "BIG";
    } else if (isDoublePair) {
      patternName = "REVERSAL PATTERN";
      predictedSz = sizes[0] === "BIG" ? "SMALL" : "BIG";
    } else if (
      streakCount === 1 &&
      sizes.length >= 3 &&
      sizes[1] === sizes[2] &&
      sizes[2] === sizes[3]
    ) {
      patternName = "REVERSAL PATTERN";
      predictedSz = sizes[0];
    } else if (cycleResult.matched) {
      patternName = "1-2 REPEATING CYCLE";
      predictedSz = cycleResult.predictedSz;
    } else {
      let bigScore = 0;
      let smallScore = 0;

      if (sizes.length >= 5) {
        const s2 = sizes[2],
          s1 = sizes[1],
          s0 = sizes[0];
        for (let i = 1; i <= sizes.length - 4; i++) {
          if (sizes[i + 2] === s2 && sizes[i + 1] === s1 && sizes[i] === s0) {
            if (sizes[i - 1] === "BIG") bigScore += 2;
            else smallScore += 2;
          }
        }
      }

      if (sizes.length >= 4) {
        const s1 = sizes[1],
          s0 = sizes[0];
        for (let i = 1; i <= sizes.length - 3; i++) {
          if (sizes[i + 1] === s1 && sizes[i] === s0) {
            if (sizes[i - 1] === "BIG") bigScore += 1;
            else smallScore += 1;
          }
        }
      }

      if (bigScore !== smallScore && (bigScore > 0 || smallScore > 0)) {
        predictedSz = bigScore > smallScore ? "BIG" : "SMALL";
        patternName =
          predictedSz === sizes[0]
            ? "DRAGON PATTERN"
            : sizes[0] === sizes[1]
            ? "REVERSAL PATTERN"
            : "ALTERNATE PATTERN";
      } else if (bigRatio20 >= 0.65 || bigRatio20 <= 0.35) {
        predictedSz = bigRatio20 >= 0.65 ? "BIG" : "SMALL";
        patternName = predictedSz === sizes[0] ? "DRAGON PATTERN" : "REVERSAL PATTERN";
      } else if (streakCount === 2) {
        patternName = "REVERSAL PATTERN";
        predictedSz = sizes[0] === "BIG" ? "SMALL" : "BIG";
      } else {
        patternName = "ALTERNATE PATTERN";
        predictedSz = sizes[0] === "BIG" ? "SMALL" : "BIG";
      }
    }

    // Number selection scoring
    const lastNumber = recent100[0]?.number;
    const candidateNumbers = predictedSz === "BIG" ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
    const transitionScore = {};
    const freqScore = {};

    for (const num of candidateNumbers) {
      transitionScore[num] = 0;
      freqScore[num] = 0;
    }

    for (let i = 1; i < recent100.length; i++) {
      const prevNum = recent100[i].number;
      const nextNum = recent100[i - 1].number;
      if (recent100[i - 1].sz === predictedSz && candidateNumbers.includes(nextNum)) {
        freqScore[nextNum] = (freqScore[nextNum] || 0) + 1;
        if (prevNum === lastNumber) {
          transitionScore[nextNum] = (transitionScore[nextNum] || 0) + 3;
        }
      }
    }

    const rankedNumbers = [...candidateNumbers].sort((a, b) => {
      const scoreA = (transitionScore[a] || 0) * 2 + (freqScore[a] || 0);
      const scoreB = (transitionScore[b] || 0) * 2 + (freqScore[b] || 0);
      return scoreB - scoreA;
    });

    let chosenNumber = rankedNumbers[0];
    if (chosenNumber === lastNumber && rankedNumbers.length > 1) {
      chosenNumber = rankedNumbers[1];
    }

    return {
      sz: predictedSz,
      rn: chosenNumber,
      pattern: patternName
    };
  }

  // ==========================================
  // UI Rendering & State Updates
  // ==========================================
  function updateUI() {
    // Launcher vs Panel visibility
    els.launcher.style.display = state.isOpen ? "none" : "flex";
    els.panelContainer.style.display = state.isOpen ? "flex" : "none";

    els.launcher.style.left = `${state.launcherPos.x}px`;
    els.launcher.style.top = `${state.launcherPos.y}px`;
    els.panelContainer.style.left = `${state.panelPos.x}px`;
    els.panelContainer.style.top = `${state.panelPos.y}px`;

    // Status Badge
    els.statusBadge.textContent =
      state.view === "locked"
        ? "LOCKED"
        : state.view === "loader"
        ? "ANALYZING"
        : "LIVE";

    // Market Buttons
    els.btn30s.classList.toggle("active", state.market === "30s");
    els.btn1m.classList.toggle("active", state.market === "1m");

    // Period Bar
    if (state.isUnlocked) {
      els.periodBar.style.display = "block";
      els.periodLabel.textContent = `${state.market === "30s" ? "30S" : "1M"} PERIOD: `;
      els.periodValue.textContent = state.period || "----";
    } else {
      els.periodBar.style.display = "none";
    }

    // Center Display Views
    els.viewLocked.style.display = state.view === "locked" ? "flex" : "none";
    els.viewLoader.style.display = state.view === "loader" ? "flex" : "none";
    els.viewResult.style.display = state.view === "result" ? "flex" : "none";

    // Primary Action Button
    els.btnPrimary.textContent = state.isUnlocked ? "HIDE" : "UNLOCK";
  }

  function getCurrentPeriodCode(marketType) {
    const now = new Date();
    const hours = now.getUTCHours();
    const minutes = now.getUTCMinutes();
    const seconds = now.getUTCSeconds();
    const totalSeconds = hours * 3600 + minutes * 60 + seconds;
    const dateStr = `${now.getUTCFullYear()}${pad2(now.getUTCMonth() + 1)}${pad2(now.getUTCDate())}`;

    let fullIssue = "";
    if (marketType === "30s") {
      const intervalIndex = Math.floor(totalSeconds / 30);
      fullIssue = dateStr + "30" + String(10001 + intervalIndex);
    } else {
      const minuteIndex = hours * 60 + minutes;
      fullIssue = dateStr + "10" + String(10001 + minuteIndex);
    }
    return fullIssue.slice(-4);
  }

  function startAnalysis(periodCode) {
    if (!periodCode) return;

    if (state.loaderInterval) {
      clearInterval(state.loaderInterval);
      state.loaderInterval = null;
    }

    state.isAnalyzing = true;
    state.view = "loader";
    els.progBar.style.width = "0%";
    els.hexCode.innerHTML = "0x0000<br>0%";
    els.loaderText.textContent = "ANALYZING 100 DRAWS...";
    updateUI();

    const historyPromise = fetchDrawHistory(state.market)
      .then((list) => {
        if (list && list.length > 0) {
          state.historyList = mergeHistory(state.historyList, list);
        }
      })
      .catch(() => {});

    const steps = [
      "FETCHING LIVE API...",
      "READING 100 DRAWS...",
      "ANALYZING PATTERNS...",
      "EXTRACTING RESULT...",
      "COMPLETED"
    ];
    let progress = 0;

    state.loaderInterval = setInterval(() => {
      progress += 5;
      if (progress >= 100) {
        clearInterval(state.loaderInterval);
        state.loaderInterval = null;
        els.progBar.style.width = "100%";

        const randHex = "0x" + Math.floor(Math.random() * 65535).toString(16).toUpperCase();
        els.hexCode.innerHTML = `${randHex}<br>100%`;
        els.loaderText.textContent = "COMPLETED";

        setTimeout(async () => {
          await historyPromise;
          if (!state.historyList.length) {
            els.resPattern.textContent = "LIVE DATA UNAVAILABLE";
            els.resValue.textContent = "--";
            els.resSub.textContent = "NO DRAW DATA — NO ESTIMATE";
            state.view = "result";
            state.isAnalyzing = false;
            updateUI();
            return;
          }
          const prediction = predictNextDraw(state.historyList);

          // Render prediction result
          els.resPattern.textContent = prediction.pattern
            ? prediction.pattern.toUpperCase()
            : "DRAGON PATTERN";
          els.resValue.textContent = prediction.sz;
          els.resBallImg.src = CONFIG.NUMBER_IMAGES[prediction.rn];
          els.resBallImg.alt = `Number ${prediction.rn}`;
          // Re-trigger pop animation
          els.resBallImg.style.animation = "none";
          void els.resBallImg.offsetWidth;
          els.resBallImg.style.animation = "numPop 0.4s cubic-bezier(.17,.89,.32,1.28)";
          els.resSub.textContent = `ESTIMATE ONLY · PERIOD ${periodCode}`;

          state.view = "result";
          state.isAnalyzing = false;
          updateUI();

          // Voice announcement
          try {
            if (window.TeamBridge && typeof window.TeamBridge.speak === "function") {
              window.TeamBridge.speak(`${prediction.sz} ${prediction.rn}`);
            } else if ("speechSynthesis" in window) {
              const utterance = new SpeechSynthesisUtterance(`${prediction.sz} ${prediction.rn}`);
              window.speechSynthesis.speak(utterance);
            }
          } catch (err) {}
        }, 150);
      } else {
        els.progBar.style.width = `${progress}%`;
        const randHex = "0x" + Math.floor(Math.random() * 65535).toString(16).toUpperCase();
        els.hexCode.innerHTML = `${randHex}<br>${progress}%`;
        const stepIdx = Math.min(
          steps.length - 1,
          Math.floor((progress / 100) * (steps.length - 1))
        );
        els.loaderText.textContent = steps[stepIdx];
      }
    }, 55);
  }

  function handleUnlockOrHide() {
    if (state.isUnlocked) {
      state.isOpen = false;
      updateUI();
      return;
    }

    const entered = els.passInput.value.trim().toLowerCase();
    if (entered === CONFIG.ACCESS_PASSWORD.toLowerCase()) {
      state.isUnlocked = true;
      els.passError.style.display = "none";
      els.passInput.value = "";

      const currentPeriod = getCurrentPeriodCode(state.market);
      state.period = currentPeriod;
      state.lastTriggeredPeriod = currentPeriod;
      updateUI();
      startAnalysis(currentPeriod);
    } else {
      els.passError.style.display = "block";
      els.passInput.value = "";
    }
  }

  // ==========================================
  // Drag & Drop Mechanics (Mouse + Touch)
  // ==========================================
  const dragState = {
    draggingLauncher: false,
    launcherStartX: 0,
    launcherStartY: 0,
    launcherOrigX: 0,
    launcherOrigY: 0,
    launcherMoved: false,

    draggingPanel: false,
    panelStartX: 0,
    panelStartY: 0,
    panelOrigX: 0,
    panelOrigY: 0
  };

  function startLauncherDrag(clientX, clientY) {
    dragState.draggingLauncher = true;
    dragState.launcherStartX = clientX;
    dragState.launcherStartY = clientY;
    dragState.launcherOrigX = state.launcherPos.x;
    dragState.launcherOrigY = state.launcherPos.y;
    dragState.launcherMoved = false;
  }

  function startPanelDrag(clientX, clientY) {
    dragState.draggingPanel = true;
    dragState.panelStartX = clientX;
    dragState.panelStartY = clientY;
    dragState.panelOrigX = state.panelPos.x;
    dragState.panelOrigY = state.panelPos.y;
  }

  function onPointerMove(clientX, clientY) {
    if (dragState.draggingLauncher) {
      const dx = clientX - dragState.launcherStartX;
      const dy = clientY - dragState.launcherStartY;
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
        dragState.launcherMoved = true;
      }
      state.launcherPos.x = Math.max(0, Math.min(window.innerWidth - 62, dragState.launcherOrigX + dx));
      state.launcherPos.y = Math.max(0, Math.min(window.innerHeight - 62, dragState.launcherOrigY + dy));
      els.launcher.style.left = `${state.launcherPos.x}px`;
      els.launcher.style.top = `${state.launcherPos.y}px`;
    }

    if (dragState.draggingPanel) {
      const dx = clientX - dragState.panelStartX;
      const dy = clientY - dragState.panelStartY;
      const maxX = Math.max(0, window.innerWidth - CONFIG.PANEL_WIDTH);
      const maxY = Math.max(0, window.innerHeight - CONFIG.PANEL_HEIGHT);
      state.panelPos.x = Math.max(0, Math.min(maxX, dragState.panelOrigX + dx));
      state.panelPos.y = Math.max(0, Math.min(maxY, dragState.panelOrigY + dy));
      els.panelContainer.style.left = `${state.panelPos.x}px`;
      els.panelContainer.style.top = `${state.panelPos.y}px`;
    }
  }

  function onPointerEnd() {
    if (dragState.draggingLauncher) {
      dragState.draggingLauncher = false;
      if (!dragState.launcherMoved) {
        state.isOpen = true;
        updateUI();
      }
    }
    if (dragState.draggingPanel) {
      dragState.draggingPanel = false;
    }
  }

  // ==========================================
  // Event Listeners & Timers
  // ==========================================
  els.launcher.addEventListener("mousedown", (e) => {
    e.preventDefault();
    startLauncherDrag(e.clientX, e.clientY);
  });
  els.launcher.addEventListener("touchstart", (e) => {
    if (e.touches[0]) {
      startLauncherDrag(e.touches[0].clientX, e.touches[0].clientY);
    }
  });

  els.panelContainer.addEventListener("mousedown", (e) => {
    if (e.target.closest("input") || e.target.closest("button")) return;
    e.preventDefault();
    startPanelDrag(e.clientX, e.clientY);
  });
  els.panelContainer.addEventListener("touchstart", (e) => {
    if (e.target.closest("input") || e.target.closest("button")) return;
    if (e.touches[0]) {
      startPanelDrag(e.touches[0].clientX, e.touches[0].clientY);
    }
  });

  window.addEventListener("mousemove", (e) => onPointerMove(e.clientX, e.clientY));
  window.addEventListener("mouseup", onPointerEnd);
  window.addEventListener(
    "touchmove",
    (e) => {
      if (e.touches[0]) {
        onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    },
    { passive: false }
  );
  window.addEventListener("touchend", onPointerEnd);

  els.btn30s.addEventListener("click", () => {
    state.market = "30s";
    state.historyList = [];
    state.lastTriggeredPeriod = "";
    updateUI();
  });

  els.btn1m.addEventListener("click", () => {
    state.market = "1m";
    state.historyList = [];
    state.lastTriggeredPeriod = "";
    updateUI();
  });

  els.btnPrimary.addEventListener("click", handleUnlockOrHide);

  els.passInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      handleUnlockOrHide();
    }
  });

  els.btnTelegram.addEventListener("click", () => {
    try {
      if (window.TeamBridge && typeof window.TeamBridge.loadUrl === "function") {
        window.TeamBridge.loadUrl(CONFIG.TELEGRAM_URL);
        return;
      }
    } catch (err) {}
    window.open(CONFIG.TELEGRAM_URL, "_blank");
  });

  // ==========================================
  // Initialization & Background Polling
  // ==========================================
  function init() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    state.launcherPos = {
      x: Math.max(10, Math.floor(w / 2 - 31)),
      y: Math.max(10, Math.floor(h / 2 - 31))
    };
    state.panelPos = {
      x: Math.max(0, Math.floor((w - CONFIG.PANEL_WIDTH) / 2)),
      y: Math.max(0, Math.floor((h - CONFIG.PANEL_HEIGHT) / 2))
    };
    updateUI();

    // Poll API history every 2.5 seconds
    const syncHistory = async () => {
      try {
        const fresh = await fetchDrawHistory(state.market);
        state.historyList = mergeHistory(state.historyList, fresh);
      } catch (err) {}
    };
    syncHistory();
    setInterval(syncHistory, 2500);

    // Live UTC period tracker (every 100ms)
    setInterval(() => {
      if (!state.isUnlocked) return;
      const currentPeriod = getCurrentPeriodCode(state.market);
      if (state.period !== currentPeriod) {
        state.period = currentPeriod;
        els.periodValue.textContent = currentPeriod;
      }
      if (state.lastTriggeredPeriod !== currentPeriod && !state.isAnalyzing) {
        state.lastTriggeredPeriod = currentPeriod;
        startAnalysis(currentPeriod);
      }
    }, 100);
  }

  init();
</script>
